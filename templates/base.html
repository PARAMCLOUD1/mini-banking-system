<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mini Bank{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="{{ url_for('index') }}">&#127974; Mini Bank</a>
    <nav>
      <a href="{{ url_for('index') }}">Accounts</a>
      <a href="{{ url_for('customers') }}">Customers</a>
      <a href="{{ url_for('open_account') }}">Open account</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
